<!doctype html>
<!--
  Source for docs/img/banner-dark.png, the 1500×500 banner at the top of the
  introduction page in dark mode. By day (brand/banner.html) the shepherd
  stands in the meadow with the flock. By night he walks ahead of them with a
  lamp, and its light falls on the path: "Your word is a lamp to my feet, and
  a light for my path" (Psalm 119:105). The hill, the flock and the card are
  the same as by day, so the two read as one scene.

  To regenerate it, run this from the repository root (adjust the path to
  Chrome for your system):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --hide-scrollbars --window-size=1500,500 \
      --default-background-color=00000000 \
      --screenshot=docs/img/banner-dark.png "file://$PWD/brand/banner-dark.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hey Bible docs banner, dark mode</title>
    <style>
      @font-face {
        font-family: 'Fredoka';
        font-weight: 300 700;
        src: url('../static/fonts/fredoka-variable-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito';
        font-weight: 200 1000;
        src: url('../static/fonts/nunito-variable-latin.woff2') format('woff2');
      }

      html,
      body {
        margin: 0;
      }

      .frame {
        box-sizing: border-box;
        width: 1500px;
        height: 500px;
        padding: 22px 46px 62px;
      }

      /* A sticker card at night: the docs' night card colour, a cream edge */
      .card {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        padding: 0 110px 0 120px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 9px solid #f3e8d6;
        border-radius: 48px;
        background: #2e384e;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
        color: #f3e8d6;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 70px;
      }

      .mark {
        flex: none;
        width: 101px;
        height: 120px;
      }

      .wordmark {
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: 120px;
        line-height: 1;
        white-space: nowrap;
      }

      /* The die-cut: a white edge all the way round the art, then a soft shadow */
      .sticker {
        flex: none;
        width: 360px;
        transform: rotate(3deg);
        filter: drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff)
          drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff)
          drop-shadow(0 12px 14px rgba(0, 0, 0, 0.4));
      }

      .sticker svg {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Soft filler: small flat sprigs and four-point stars, scattered thinly in
         the gaps. Each is placed by its centre. */
      .bit {
        position: absolute;
        translate: -50% -50%;
      }

      .bit.leaf {
        opacity: 0.7;
      }
    </style>
  </head>
